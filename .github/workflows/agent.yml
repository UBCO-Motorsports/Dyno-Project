# Coding agent on demand: label an issue `agent-now`.
# Provider: AGENT_PROVIDER=cursor|grok|claude (see .github/agents/README.md).
# For cursor/grok, Actions posts the prompt hand-off; Grokbot/Cursor opens the draft PR.
# For claude, Claude Code Action runs in this job (needs CLAUDE_CODE_OAUTH_TOKEN + GH_PAT).

name: Coding agent

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  implement-labeled-issue:
    if: github.event.label.name == 'agent-now'
    runs-on: ubuntu-latest
    concurrency:
      group: agent-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      AGENT_PROVIDER: ${{ vars.AGENT_PROVIDER || 'cursor' }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Resolve provider
        id: prov
        run: |
          echo "AGENT_PROVIDER=$AGENT_PROVIDER"
          echo "provider=$AGENT_PROVIDER" >> "$GITHUB_OUTPUT"

      # ----- cursor | grok: hand off to Grokbot / Cursor -----
      - name: Hand off to external coding agent
        if: env.AGENT_PROVIDER == 'cursor' || env.AGENT_PROVIDER == 'grok'
        run: |
          body=$(printf '%s\n' \
            "### Coding-agent hand-off (\`AGENT_PROVIDER=$AGENT_PROVIDER\`)" \
            "" \
            "Label \`agent-now\` was added. Run the coding agent with:" \
            "- \`.github/agents/prompts/coding-agent.md\`" \
            "- root \`AGENTS.md\`" \
            "" \
            "Substitute \`\$ISSUE=$ISSUE\` and \`\$REPO=$GITHUB_REPOSITORY\`." \
            "Open one **draft** PR, label it \`overnight-agent\`, remove \`agent-now\` / \`overnight-queue\`." \
            "If blocked, add \`needs-human\` and comment.")
          gh issue comment "$ISSUE" --body "$body"
          echo "handed_off=true" >> "$GITHUB_OUTPUT"

      - name: External provider — do not fail this job on missing PR
        if: env.AGENT_PROVIDER == 'cursor' || env.AGENT_PROVIDER == 'grok'
        run: |
          echo "Provider $AGENT_PROVIDER owns the implementation outside this job."
          echo "When the draft PR lands, CI + Lola still run on GitHub."

      # ----- claude -----
      - uses: actions/setup-python@v5
        if: env.AGENT_PROVIDER == 'claude'
        with:
          python-version: "3.11"

      - name: Language server for the LSP plugin
        if: env.AGENT_PROVIDER == 'claude'
        run: pip install pyright

      - uses: anthropics/claude-code-action@v1
        if: env.AGENT_PROVIDER == 'claude'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GH_PAT }}
          plugin_marketplaces: |
            https://github.com/anthropics/claude-plugins-official.git
            https://github.com/DietrichGebert/ponytail.git
          plugins: |
            ponytail@ponytail
            security-guidance@claude-plugins-official
            pyright-lsp@claude-plugins-official
          claude_args: >-
            --allowedTools "Bash(python:*),Bash(python3:*),Bash(pip:*),Bash(py:*),Bash(pytest:*),Bash(ruff:*),Bash(git:*),Bash(gh:*),Bash(mkdir:*),Bash(ls:*),Bash(cat:*),Bash(cp:*),Bash(mv:*),Bash(rm:*),Bash(touch:*),Bash(chmod:*),Bash(find:*),Bash(grep:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(echo:*),Bash(cd:*),Bash(pwd),Bash(test:*),Bash(bash scripts/*),Bash(scripts/*),Edit,Write,Read,Glob,Grep,Task"
          prompt: |
            Follow .github/agents/prompts/coding-agent.md exactly.
            Substitute $ISSUE=${{ github.event.issue.number }} and $REPO=${{ github.repository }}.

      - name: Fail if Claude opened no PR
        if: always() && env.AGENT_PROVIDER == 'claude'
        run: |
          n=${{ github.event.issue.number }}
          if gh pr list --repo "$GITHUB_REPOSITORY" --search "Closes #$n" --state open --json number --jq 'length' | grep -qx '[1-9][0-9]*'; then
            echo "PR found for #$n"; exit 0
          fi
          if gh pr list --repo "$GITHUB_REPOSITORY" --state open --json headRefName,number --jq "[.[] | select(.headRefName | startswith(\"issue-$n-\"))] | length" | grep -qx '[1-9][0-9]*'; then
            echo "PR found by branch prefix for #$n"; exit 0
          fi
          if gh issue view "$n" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' | grep -qx needs-human; then
            echo "No PR, but #$n was handed back with needs-human"; exit 0
          fi
          echo "::error::Claude finished without a PR or a needs-human hand-off for #$n"; exit 1
