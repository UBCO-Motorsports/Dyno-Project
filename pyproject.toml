[project]
name = "dyno"
version = "0.1.0"
description = "Supervisory software for the UBCO Motorsports water-brake dynamometer."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
dev = ["pytest>=8.3", "ruff>=0.7", "matplotlib>=3.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
